[project]
name = "mothership"
version = "0.1.0"
description = "Discord notifier for new Comedy Mothership show listings"
authors = [
    {name = "Mike", email = "catplusmike@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "PyNaCl>=1.5",
    "mypy-boto3-dynamodb>=1.35",
    "pydantic>=2.0",
    "awslambdaric>=3.0",
]

[project.optional-dependencies]
scraper = ["playwright>=1.50"]

[project.scripts]
scrape = "mothership.tasks.get_new_mothership_events:lambda_handler"

[tool.uv.sources]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]

[tool.uv.build-backend]
module-name = "mothership"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true
show-fixes = true

lint.select = ["F", "E", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "nacl.*", "awslambdaric.*", "pythonjsonlogger.*", "mypy_boto3_dynamodb.*", "playwright.*"]
ignore_missing_imports = true
